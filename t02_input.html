<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover: draw under the notch too; the game handles safe areas itself -->
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <!-- One copy per game: `cargo xtask web` writes <bin>.html with t02_input and 2. Input filled. -->
  <title>2. Input · rustine</title>

  <!-- Installable app ("Add to Home Screen") -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="rustine">
  <!-- black-translucent: the installed iOS app draws under the status bar and the notch.
       The game world extends there; the platform reads env(safe-area-inset-*) and the engine
       keeps the design area (arena, interface) clear of them. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">

  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
    canvas {
      display: block;
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;  /* fallback for old browsers */
      height: 100dvh; /* the visible height: in a Safari tab, 100vh hides behind the toolbars */
      touch-action: none; /* touches go to the game: no page zoom, scroll or double-tap zoom */
    }
    /* Back to the list: an installed app (fullscreen) has no browser back button. Small, in
       the top-left corner (where "back" usually is), clear of the notch. It takes the
       touches on itself only. */
    #back {
      position: fixed;
      left: calc(env(safe-area-inset-left, 0px) + 8px);
      top: calc(env(safe-area-inset-top, 0px) + 8px);
      z-index: 1;
      padding: 4px 10px;
      font: 14px/1.4 ui-monospace, Menlo, Consolas, monospace;
      color: #fff;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 4px;
      text-decoration: none;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <a id="back" href="./" aria-label="Back to the list">&#8592; list</a>
  <script>
    // Emscripten reads this global object; SDL draws into Module.canvas.
    var Module = { canvas: document.getElementById("canvas") };

    // Offline support. `navigator.serviceWorker` only exists on HTTPS (and localhost),
    // so this does nothing on the LAN dev server. Skipped on localhost too, so desktop
    // dev never runs a stale cached build.
    var isLocalhost = ["localhost", "127.0.0.1", "[::1]"].includes(location.hostname);
    if ("serviceWorker" in navigator && !isLocalhost) {
      navigator.serviceWorker.register("sw.js");
    }
  </script>
  <!-- t02_input = the game's binary name, filled in by `cargo xtask web` -->
  <script src="t02_input.js"></script>
</body>
</html>

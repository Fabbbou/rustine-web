<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover: draw under the notch too; the game handles safe areas itself -->
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <title>rustine</title>

  <!-- Installable app ("Add to Home Screen") -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="rustine">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">

  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <script>
    // Emscripten reads this global object; SDL draws into Module.canvas.
    var Module = { canvas: document.getElementById("canvas") };

    // Offline support. `navigator.serviceWorker` only exists on HTTPS (and localhost),
    // so this does nothing on the LAN dev server. Skipped on localhost too, so desktop
    // dev never runs a stale cached build.
    var isLocalhost = ["localhost", "127.0.0.1", "[::1]"].includes(location.hostname);
    if ("serviceWorker" in navigator && !isLocalhost) {
      navigator.serviceWorker.register("sw.js");
    }
  </script>
  <script src="platform_sdl.js"></script>
</body>
</html>
